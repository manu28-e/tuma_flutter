name: Build Tuma APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -q tuma_flutter_demo.zip
          mv tuma_flutter/* .
          mv tuma_flutter/.[!.]* . 2>/dev/null || true
          rm -rf tuma_flutter

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuma-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          
